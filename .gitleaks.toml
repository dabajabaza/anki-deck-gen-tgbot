# Расширяет стандартный набор правил gitleaks, а не заменяет его.
[extend]
useDefault = true

# Зачем это правило.
# Стоковое telegram-bot-api-token срабатывает только при слове «telegram» рядом
# с секретом. Токен живёт в TELEGRAM_BOT_TOKEN ровно ради этого — но окружение
# бота задаётся не только этим репозиторием (env-файл на сервере, заметки в
# README), и переименование переменной не должно тихо открыть дыру. Поэтому токен
# ловится и по форме: 8–10 цифр, двоеточие, 35 символов base64url.
[[rules]]
id = "telegram-bot-token-anywhere"
description = "Telegram bot token (not gated on a keyword)"
regex = '''\b[0-9]{8,10}:[A-Za-z0-9_-]{35}\b'''
tags = ["telegram", "token"]

  # Форма-массив [[rules.allowlists]], а не устаревшая единственная
  # [rules.allowlist]: v8 молча игнорирует последнюю.
  #
  # Критерии внутри ОДНОГО блока объединяются по И — поэтому путь и регулярка
  # в разных блоках: вместе они исключали бы только файл, удовлетворяющий обоим.
  [[rules.allowlists]]
  description = "Сам этот конфиг, чтобы правило не ловило собственные примеры"
  paths = ['''\.gitleaks\.toml$''']

  [[rules.allowlists]]
  description = "Заведомо фальшивый токен тестового харнесса"
  regexes = ['''123456:A{35}''']
