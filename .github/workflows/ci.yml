name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

# Один активный прогон на ref: новый push отменяет предыдущий.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  # Имя job'а И ЕСТЬ имя статус-чека, на который ссылается ruleset ветки main и
  # который сервер ищет перед выкаткой тега (анонимный вызов check-runs API).
  # Переименовать нельзя без правки ruleset'а: защита молча перестанет требовать
  # зелёный CI, а деплой перестанет находить чек и больше не выкатит ни одного тега.
  ci:
    name: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks смотрит всю историю, не только последний коммит
          fetch-depth: 0

      - name: Scan for secrets
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" detect \
            --source . --log-opts=--all --no-banner --redact

      # Точная версия, а не мажорный тег: setup-uv публикует плавающие теги
      # только до v7, хотя релизы дошли до 9.0.0. Ссылка @v9 не резолвится,
      # и job падает на «Set up job», не дойдя ни до одного шага.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies strictly from the lock file
        run: uv sync --locked

      # На сервере нет uv: там зависимости ставятся pip'ом из requirements.txt,
      # который генерируется из uv.lock. Забытая регенерация означала бы, что
      # деплой ставит то, чего CI не проверял, — и расхождение было бы молчаливым.
      # Регенерируем той же командой и требуем отсутствия диффа.
      - name: requirements.txt still matches uv.lock
        run: |
          uv export --format requirements-txt --no-hashes --no-dev -o requirements.txt
          git diff --exit-code -- requirements.txt

      # Jail — FreeBSD, где на PyPI нет wheels вовсе: всё без чистого wheel
      # собирается из исходников, а pydantic-core требует Rust, которого в jail нет.
      # Такие пакеты берутся из py312-* портов, и это работает только пока
      # прибитая версия совпадает с портом точно.
      - name: Pins still match the FreeBSD ports tree
        run: python3 scripts/check-freebsd-pins.py

      - name: Lint
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy src tests

      - name: Tests
        run: uv run pytest -q
